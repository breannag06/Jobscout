<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Job board{% endblock %}</title>
<style>
  :root {
    --paper: #faf7f2; --card: #ffffff; --ink: #2b2622; --soft: #7a6f66; --line: #e8e0d6;
    --cherry: #ba0c2f; --cherry-soft: #f8e5e8; --cherry-ink: #ffffff;
    --green: #2f6f4f; --green-soft: #e3f0e8; --amber: #8a5300; --amber-soft: #fbefd9;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1b1917; --card: #24211e; --ink: #eee8e1; --soft: #a99d92; --line: #36312c;
      --cherry: #ef5a72; --cherry-soft: #3a2026; --cherry-ink: #1b1917;
      --green: #7cc59e; --green-soft: #1f3128; --amber: #f0b45c; --amber-soft: #3a2d17;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 32px 16px 72px; }
  a { color: var(--cherry); }
  h1, h2 { font-family: var(--serif); font-weight: 600; letter-spacing: -0.01em; }
  h1 { font-size: 30px; margin: 0; }
  h2 { font-size: 19px; margin: 28px 0 10px; }

  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;
         flex-wrap: wrap; padding-bottom: 14px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  .top nav a { margin-left: 14px; color: var(--soft); text-decoration: none; font-size: 14px; }
  .top nav a:hover, .top nav a.here { color: var(--ink); }
  .date { color: var(--soft); font-size: 14px; margin-top: 2px; }
  .summary { font-size: 16px; margin: 0 0 16px; }
  .summary b { font-weight: 600; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 18px; }
  .tabs a { padding: 6px 13px; border-radius: 999px; text-decoration: none; color: var(--ink);
            background: var(--card); border: 1px solid var(--line); font-size: 14px; }
  .tabs a:hover { border-color: var(--soft); }
  .tabs a.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .tabs a span { margin-left: 5px; opacity: .6; font-variant-numeric: tabular-nums; }

  .note { padding: 11px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 14px;
          background: var(--amber-soft); color: var(--amber); }
  .note.cherry { background: var(--cherry-soft); color: var(--cherry); }

  .job { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
         padding: 16px 18px; margin-bottom: 10px; }
  .job.asking { border-color: var(--cherry); box-shadow: inset 3px 0 0 var(--cherry); }
  .job-head { display: flex; gap: 16px; justify-content: space-between; align-items: flex-start;
              flex-wrap: wrap; }
  .job-main { flex: 1 1 340px; min-width: 0; }
  .job-title { font-family: var(--serif); font-size: 18px; font-weight: 600; line-height: 1.3;
               overflow-wrap: anywhere; }
  .job-title a { color: var(--ink); text-decoration: none; }
  .job-title a:hover { color: var(--cherry); text-decoration: underline; }
  .where { color: var(--soft); font-size: 14px; margin-top: 2px; }
  .tags { margin-top: 8px; }
  .tag { display: inline-block; margin: 0 4px 4px 0; padding: 1px 9px; border-radius: 999px;
         font-size: 12px; background: var(--paper); border: 1px solid var(--line); color: var(--soft);
         text-decoration: none; }
  .tag.fit { background: var(--cherry-soft); border-color: transparent; color: var(--cherry); font-weight: 600; }
  .tag.good { background: var(--green-soft); border-color: transparent; color: var(--green); }
  .tag.heads-up { background: var(--amber-soft); border-color: transparent; color: var(--amber); }
  .why { color: var(--soft); font-size: 13px; margin-top: 6px; }
  .ask { color: var(--cherry); font-size: 14px; margin-top: 10px; }

  .actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  form { display: inline; margin: 0; }
  .btn, button { cursor: pointer; padding: 7px 13px; border-radius: 8px; font: inherit; font-size: 14px;
                 border: 1px solid var(--line); background: var(--card); color: var(--ink);
                 text-decoration: none; display: inline-block; }
  .btn:hover, button:hover { border-color: var(--soft); }
  .btn.go, button.go { background: var(--cherry); border-color: var(--cherry); color: var(--cherry-ink);
                       font-weight: 600; }
  details.notes { margin-top: 10px; }
  details.notes summary, details.add summary { cursor: pointer; color: var(--soft); font-size: 13px; }
  details.add { margin-bottom: 16px; }
  details.add summary { font-size: 14px; }
  textarea, input[type=text], input[type=url] { width: 100%; padding: 8px 10px; font: inherit;
      border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
  textarea { min-height: 72px; }
  .stack { display: grid; gap: 8px; margin-top: 10px; max-width: 520px; }
  .empty { padding: 40px 16px; text-align: center; color: var(--soft); font-family: var(--serif);
           font-size: 17px; }
  footer { margin-top: 40px; color: var(--soft); font-size: 13px; text-align: center; }

  .answers { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin: 0; }
  .answer { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px;
            border-bottom: 1px solid var(--line); }
  .answer:last-child { border-bottom: 0; }
  .answer dt { width: 210px; flex: none; color: var(--soft); font-size: 14px; }
  .answer dd { margin: 0; flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; }
  .answer dd.blank { color: var(--soft); font-style: italic; }
  @media (max-width: 600px) { .answer { flex-direction: column; gap: 4px; } .answer dt { width: auto; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>{% block heading %}Job board{% endblock %}</h1>
      <div class="date">{{ today }}</div>
    </div>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'here' if request.endpoint == 'index' }}">Jobs</a>
      <a href="{{ url_for('kit') }}" class="{{ 'here' if request.endpoint == 'kit' }}">My answers</a>
      <a href="{{ url_for('tracker') }}" target="_blank" rel="noopener">Applications (PDF)</a>
    </nav>
  </div>
  {% block content %}{% endblock %}
  <footer>New jobs show up every few hours. The daily summary goes out at 2:05 pm.</footer>
</main>
<script>
  // Copy buttons on the answers page.
  document.addEventListener("click", async (event) => {
    const button = event.target.closest("[data-copy]");
    if (!button) return;
    try { await navigator.clipboard.writeText(document.getElementById(button.dataset.copy).innerText); }
    catch (e) { return; }
    const label = button.textContent;
    button.textContent = "Copied!";
    setTimeout(() => { button.textContent = label; }, 1200);
  });
  // The application opens in a new tab; refresh this one so it can ask whether I applied.
  document.addEventListener("click", (event) => {
    if (event.target.closest("a[data-apply]")) setTimeout(() => location.reload(), 800);
  });
</script>
</body>
</html>
